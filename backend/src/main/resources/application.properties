server.port=8080
spring.threads.virtual.enabled=true

# The console's lines are also kept in a file (a new one from 10 MB), so a run can be read afterwards.
logging.file.name=logs/backend.log

# Where raw session recordings (.wav) are saved. Relative to the directory you start the app from.
debatechecker.recordings-dir=recordings

# ---- Local speech models (run download-models.ps1 once to fetch them) ----
debatechecker.models-dir=models
debatechecker.vad-model=${debatechecker.models-dir}/silero_vad.onnx
debatechecker.asr-dir=${debatechecker.models-dir}/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
debatechecker.speaker-model=${debatechecker.models-dir}/nemo_en_titanet_small.onnx

# Claim gate: gate.onnx, vocab.txt and gate.json (the threshold), built by classifier/export_onnx.py.
debatechecker.claim-gate-dir=${debatechecker.models-dir}/claim-gate

# Local LLM (Ollama) that rewrites passed sentences into standalone claims. It is loaded entirely
# on the GPU. 127.0.0.1, not localhost: the name lookup added ~2 s per call on Windows.
# Fetch the model once with: ollama pull gemma3:4b
debatechecker.llm-url=http://127.0.0.1:11434
debatechecker.llm-model=gemma3:4b
debatechecker.llm-timeout-seconds=10

# ---- Fact-checking ----
# Google Fact Check Tools API: published fact-checks (PolitiFact, FactCheck.org, ...) with their ratings.
# Free, but needs a key: console.cloud.google.com -> enable "Fact Check Tools API" -> Credentials ->
# API key. Keep it out of git: set the environment variable GOOGLE_FACTCHECK_KEY (in IntelliJ: the run
# configuration's "Environment variables"). Without a key no claim gets a verdict.
debatechecker.google-factcheck-key=${GOOGLE_FACTCHECK_KEY:}
# Web search for passages that bear on a claim (exa.ai, free allowance of $10 a month, about
# $0.007 a claim). Environment variable EXA_API_KEY, as above. Without a key Wikipedia is used.
debatechecker.exa-key=${EXA_API_KEY:}
# The judge: once a minute, one request with that minute's claims and their web passages to a Gemini
# model on the free tier (aistudio.google.com -> Get API key). Environment variable GEMINI_API_KEY.
# Without a key, or without web passages, such claims stay "could not be verified".
debatechecker.gemini-key=${GEMINI_API_KEY:}
debatechecker.judge-model=gemini-3.5-flash-lite
debatechecker.judge-timeout-seconds=25
# Wikipedia asks API users to say who they are; add a way to reach you in the brackets if you like.
debatechecker.wikipedia-user-agent=Podium/0.1 (personal project)
debatechecker.factcheck-timeout-seconds=8

# CPU threads for speech-to-text. The 5600H has 6 cores / 12 threads; 4 leaves room for everything else.
debatechecker.asr-threads=4

# Cosine similarity (TitaNet fingerprints) needed to say "same speaker as before".
# Lower = merges speakers more readily, higher = splits one person into several labels.
# Measured: same speaker >= 0.7, different speakers <= 0.25 on clean audio. Tune with tools.Replay.
debatechecker.speaker-threshold=0.45
# Upper bound on distinct speakers per session (host + debaters + the odd audience voice).
debatechecker.max-speakers=6

# Segmentation: a segment ends after this much silence, and is force-cut at max-segment-seconds
# (at the quietest point near the end) so one long monologue can't blow the latency budget.
# 5 s tested best: 4 s cut words more often, longer segments add delay.
debatechecker.vad-min-silence-seconds=0.3
debatechecker.vad-max-segment-seconds=5

# Claims are checked and reported together, speaker by speaker, once per this many seconds of the debate.
# 40 since 2026-10-08 (user: verdicts sooner). One judge request per window: a 90-minute debate
# is about 135 requests at 40, 90 at 60, 180 at 30; the free tier's daily limit is not known.
debatechecker.digest-seconds=40
